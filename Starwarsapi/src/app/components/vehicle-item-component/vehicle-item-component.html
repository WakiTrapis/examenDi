<div class="card h-100">
    <div class="card-body">
        <h5 class="card-title">{{ vehicle()?.name }}</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">{{ vehicle()?.model }}</h6>
        <h5>{{vehicle()?.url}}</h5>
        
        <button class="btn btn-primary" (click)="emitVehicleClicked()">View Details</button>
    </div>
</div>
